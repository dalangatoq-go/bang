<body class="mk pn" data-tab="Masuk" data-p="pin">
<script>try{document.documentElement.style.background="#07111f"}catch(e){}</script>
<div class="app" id="app"><div id="ui"><script>/* skala 360dp diterapkan sebelum paint pertama agar nav tidak melompat saat core.js selesai dimuat */(function(){try{var a=document.getElementById('app'),u=document.getElementById('ui');if(!a||!u)return;document.documentElement.style.setProperty('--app-h',Math.round(window.innerHeight)+'px');var w=a.clientWidth,h=a.clientHeight;if(!w||!h)return;var k=w/360;if('zoom' in document.documentElement.style){u.style.zoom=k}else{u.style.transformOrigin='0 0';u.style.transform='scale('+k+')'}u.style.setProperty('--k',k);}catch(e){}})();</script>
<button class="ab x" id="pin-x" aria-label="Tutup"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M4 4l16 16M20 4L4 20"/></svg></button>
<span class="txt ttl">Masukkan PIN kamu</span>

<h1>Ketik GoPay PIN kamu untuk masuk.</h1>
<p class="sub">Ini cepat, aman, dan tidak memerlukan OTP.</p>

<div class="pw"><span>Powered by</span><svg viewBox="0 0 24 24"><rect x="1" y="5" width="22" height="16" rx="5" fill="#18a8f0"/><rect x="1" y="2.5" width="14" height="6" rx="3" fill="#18a8f0"/><rect x="14.5" y="11.5" width="8.5" height="5" rx="2.5" fill="#dff3ff"/></svg><b>gopay</b></div>
