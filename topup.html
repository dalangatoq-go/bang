<div class="app" id="app"><div id="ui"><script>/* skala 360dp diterapkan sebelum paint pertama agar nav tidak melompat saat core.js selesai dimuat */(function(){try{var a=document.getElementById('app'),u=document.getElementById('ui');if(!a||!u)return;document.documentElement.style.setProperty('--app-h',Math.round(window.innerHeight)+'px');var w=a.clientWidth,h=a.clientHeight;if(!w||!h)return;var k=w/360;if('zoom' in document.documentElement.style){u.style.zoom=k}else{u.style.transformOrigin='0 0';u.style.transform='scale('+k+')'}u.style.setProperty('--k',k);}catch(e){}})();</script>
